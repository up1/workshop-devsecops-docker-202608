services:
  api:
    image: somkiat/nodeapi:1.0
    build: ./api
    ports: [ "3000:3000" ]
    environment:
      PGHOST: db
      PGUSER: appuser
      PGPASSWORD: ${PGPASSWORD:-supersecret}
      PGDATABASE: booksdb
      NODE_ENV: production
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:3000/health || exit 1" ]
      interval: 3s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: ${PGPASSWORD:-supersecret}
      POSTGRES_DB: booksdb
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U appuser -d booksdb" ]
      interval: 5s
      timeout: 5s
      retries: 5

  api-testing:
    build:
      context: ./api-testing
    volumes:
      - ./api-testing:/src
      - ./api-testing/reports:/src/reports
    depends_on:
      api:
        condition: service_healthy

  dev-test:
    build:
      context: ./api
      target: test
    environment:
      NODE_ENV: test
    volumes:
      # integration tests use Testcontainers, which needs the host docker daemon
      - /var/run/docker.sock:/var/run/docker.sock
      - ./api/reports:/app/reports
      # matches the ../../../db/init.sql path the test resolves relative to the repo root
      - ./db:/db:ro

volumes: { pgdata: {} }
networks: { appnet: {} }
